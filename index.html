<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f8">
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">TASK MANAGER</div>
        <h1 id="pageTitle">今日</h1>
      </div>
      <button class="icon-btn" id="quickAddBtn" aria-label="タスク追加">＋</button>
    </header>

    <main>
      <section id="homeView" class="view active">
        <div class="progress-card">
          <div class="progress-head">
            <span>今日の進捗</span>
            <strong id="progressText">0 / 0</strong>
          </div>
          <div class="progress-track"><div id="progressBar"></div></div>
        </div>
        <div id="todayList" class="task-list"></div>
        <div id="emptyToday" class="empty hidden">
          <div class="empty-icon">○</div>
          <h2>今日のTodoはありません</h2>
          <p>「タスク」から今日やるものを追加してください。</p>
          <button class="primary-btn" data-go="tasks">タスクを見る</button>
        </div>
      </section>

      <section id="tasksView" class="view">
        <div class="toolbar">
          <label class="search">
            <span>⌕</span>
            <input id="searchInput" type="search" placeholder="タスクを検索">
          </label>
          <button class="filter-btn" id="filterBtn">絞り込み</button>
        </div>
        <div id="filterPanel" class="filter-panel hidden">
          <select id="subjectFilter">
            <option value="">すべての科目</option>
          </select>
          <select id="typeFilter">
            <option value="">すべての種類</option>
            <option>暗記</option>
            <option>演習</option>
            <option>復習</option>
          </select>
        </div>
        <div class="section-row">
          <span id="taskCount">0件</span>
          <button class="text-btn" id="importBtn">tasks.jsonを読み込む</button>
          <input id="jsonFile" type="file" accept=".json,application/json" hidden>
        </div>
        <div id="taskList" class="task-list"></div>
      </section>

      <section id="historyView" class="view">
        <div class="section-row">
          <span>実行履歴</span>
          <button class="text-btn danger" id="clearHistoryBtn">履歴を消去</button>
        </div>
        <div id="historyList"></div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-item active" data-view="home">
        <span>⌂</span><small>今日</small>
      </button>
      <button class="nav-item" data-view="tasks">
        <span>☷</span><small>タスク</small>
      </button>
      <button class="nav-item" data-view="history">
        <span>◷</span><small>履歴</small>
      </button>
    </nav>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="sheet">
      <div class="sheet-head">
        <h2 id="modalTitle">タスクを追加</h2>
        <button class="icon-btn close-btn" id="closeModal">×</button>
      </div>
      <form id="taskForm">
        <input type="hidden" id="editId">
        <label>タイトル<input id="titleInput" required maxlength="100" placeholder="例：英文解釈 10題"></label>
        <div class="two-col">
          <label>科目<select id="subjectInput">
            <option>英語</option><option>数学</option><option>国語</option>
            <option>日本史</option><option>世界史</option><option>物理基礎</option>
            <option>生物基礎</option><option>情報</option><option>その他</option>
          </select></label>
          <label>種類<select id="typeInput">
            <option>暗記</option><option>演習</option><option>復習</option>
          </select></label>
        </div>
        <label>目安時間（分）<input id="minutesInput" type="number" min="1" max="1440" value="30"></label>
        <label>メモ<textarea id="memoInput" rows="3" maxlength="500" placeholder="必要ならメモ"></textarea></label>
        <div class="form-actions">
          <button type="button" class="secondary-btn hidden" id="deleteBtn">削除</button>
          <button type="submit" class="primary-btn">保存</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
